# Cloudflare Pages — publica o app (dist/) + as Functions (functions/), incluindo o cofre
# de sincronização em /v1/cofre/:id. O binding KV "COFRE" é o mesmo namespace já criado.
name = "mentor-concurso"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "COFRE"
id = "0964d6f3137342ce9466438e6acf456f"

# Bucket R2 que passou a guardar os cofres (19/08/2026): o KV tem teto de 25 MiB por valor e o
# snapshot da biblioteca passou disso. O binding KV acima continua para LER cofre antigo.
[[r2_buckets]]
binding = "COFRE_R2"
bucket_name = "mentor-cofre"
